name: Android Build

on:
  push:
    paths:
      - "src/android/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/android/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 14 SDK packages and accept licenses
        run: |
          # sdkmanager exits successfully after the last prompt; without pipefail, the
          # producer's expected SIGPIPE from `yes` does not fail this step.
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: screen-recorder-app-debug
          path: src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
